<path d="M0 662 L588 420" stroke="#93a59a" stroke-opacity="0.16" stroke-width="8"/><path d="M0 682 L588 426" stroke="#121f27" stroke-width="21"/></g>
<g><path d="M1600 290 L970 390" stroke="#9daea1" stroke-opacity="0.28" stroke-width="8"/><path d="M1600 310 L970 396" stroke="#121f27" stroke-width="21"/>
<path d="M1600 352 L977 395" stroke="#9daea1" stroke-opacity="0.26" stroke-width="8"/><path d="M1600 372 L977 401" stroke="#121f27" stroke-width="21"/>
<path d="M1600 414 L984 400" stroke="#9daea1" stroke-opacity="0.23" stroke-width="8"/><path d="M1600 434 L984 406" stroke="#121f27" stroke-width="21"/>
<path d="M1600 476 L991 405" stroke="#9daea1" stroke-opacity="0.21" stroke-width="8"/><path d="M1600 496 L991 411" stroke="#121f27" stroke-width="21"/>
<path d="M1600 538 L998 410" stroke="#9daea1" stroke-opacity="0.19" stroke-width="8"/><path d="M1600 558 L998 416" stroke="#121f27" stroke-width="21"/>
<path d="M1600 600 L1005 415" stroke="#9daea1" stroke-opacity="0.17" stroke-width="8"/><path d="M1600 620 L1005 421" stroke="#121f27" stroke-width="21"/>
<path d="M1600 662 L1012 420" stroke="#9daea1" stroke-opacity="0.14" stroke-width="8"/><path d="M1600 682 L1012 426" stroke="#121f27" stroke-width="21"/></g>
<path d="M90 0 L684 345 M1510 0 L916 345" stroke="#b5c5ac" stroke-width="8" opacity=".12"/>
<!-- Corridor lighting -->
<g fill="#cce7cb">
<polygon points="440,72 1160,72 1028,115 572,115" opacity=".65"/>
<polygon points="566,166 1034,166 973,190 626,190" opacity=".52"/>
<polygon points="643,236 957,236 929,250 671,250" opacity=".45"/>
<polygon points="695,286 905,286 890,294 710,294" opacity=".35"/>
<polygon points="746,321 854,321 845,326 755,326" opacity=".3"/>
</g>
<g fill="#d6efcc" filter="url(#glow)" opacity=".52">
<polygon points="440,77 1160,77 1028,114 572,114"/>
<polygon points="570,166 1030,166 973,189 626,189"/>
</g>
<!-- Checkout number / impossible clock -->
<g font-family="'Courier New',monospace">
<rect x="1217" y="94" width="274" height="145" rx="7" fill="#041019" fill-opacity=".9" stroke="#90b5a2" stroke-opacity=".43" stroke-width="2"/>
<text x="1250" y="132" fill="#9abdae" font-size="21" letter-spacing="7">CLOCK</text>
<text x="1250" y="199" fill="#e8d4a3" font-size="67" letter-spacing="7" font-weight="bold">03:17</text>
<path d="M1250 213 H1465" stroke="#729783" stroke-width="2" opacity=".7"/>
</g>
<!-- UI labels -->
<g font-family="'Courier New',monospace" fill="#bdcfbf">
<text x="104" y="91" font-size="22" letter-spacing="7">BASE // ARCHIVE</text>
<text x="107" y="126" font-size="15" letter-spacing="5" opacity=".66">LEVEL 0 — THE ENDLESS MART</text>
</g>
<rect width="1600" height="900" fill="url(#fade)"/>
<rect width="1600" height="900" fill="url(#vignette)" opacity=".65"/>
<rect width="1600" height="900" filter="url(#grain)" opacity=".085"/>
<!-- Teaser typography -->
<text x="800" y="743" fill="#f6f1df" font-family="Georgia,'Times New Roman',serif" font-size="139" letter-spacing="24" text-anchor="middle">NULVORIA</text>
<text x="800" y="791" fill="#c9dfd3" font-family="Arial,sans-serif" font-size="20" letter-spacing="10" text-anchor="middle">IL LUOGO RICORDA</text>
<path d="M520 818 H1080" stroke="#c4c9b2" stroke-opacity=".45" stroke-width="1"/>
<text x="800" y="853" fill="#d8be91" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="7" text-anchor="middle">FILM IN PREPARAZIONE  ·  PROSSIMAMENTE</text>
</svg>