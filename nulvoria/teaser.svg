<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">NULVORIA — anteprima cinematografica</title>
<desc id="desc">Illustrazione originale di un supermercato liminale deserto: corsie interminabili, luci fluorescenti, una cassa lontana e un orologio bloccato alle 03:17.</desc>
<defs>
<linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0b1a22"/><stop offset=".5" stop-color="#162c2b"/><stop offset="1" stop-color="#050d14"/></linearGradient>
<linearGradient id="floor" x2="0" y2="1"><stop stop-color="#25433d"/><stop offset=".6" stop-color="#112527"/><stop offset="1" stop-color="#06121b"/></linearGradient>
<linearGradient id="left" x2="1" y2=".2"><stop stop-color="#050f18"/><stop offset=".7" stop-color="#243832"/><stop offset="1" stop-color="#53695b"/></linearGradient>
<linearGradient id="right" x2="0" y2=".3"><stop stop-color="#050f17"/><stop offset=".75" stop-color="#27392f"/><stop offset="1" stop-color="#566958"/></linearGradient>
<radialGradient id="light" cx=".5" cy=".28" r=".7"><stop stop-color="#c4dcc3" stop-opacity=".64"/><stop offset=".4" stop-color="#8ac1ad" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="fade" x2="0" y2="1"><stop stop-color="#071219" stop-opacity=".16"/><stop offset=".59" stop-color="#071219" stop-opacity=".08"/><stop offset=".79" stop-color="#071219" stop-opacity=".71"/><stop offset="1" stop-color="#050b13" stop-opacity="1"/></linearGradient>
<radialGradient id="vignette"><stop offset=".45" stop-color="#02070c" stop-opacity="0"/><stop offset="1" stop-color="#02070c" stop-opacity=".9"/></radialGradient>
<filter id="glow" x="-60%" y="-100%" width="220%" height="300%"><feGaussianBlur stdDeviation="11"/></filter>
<filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect width="1600" height="900" fill="url(#light)"/>
<!-- A supermarket that recedes toward one impossible central vanishing point. -->
<polygon points="0,0 1600,0 950,348 650,348" fill="#1e312f"/>
<polygon points="0,0 650,348 650,550 0,900" fill="url(#left)"/>
<polygon points="1600,0 950,348 950,550 1600,900" fill="url(#right)"/>
<polygon points="0,900 650,550 950,550 1600,900" fill="url(#floor)"/>
<rect x="646" y="345" width="308" height="210" fill="#0b1d21" stroke="#779f92" stroke-opacity=".7" stroke-width="4"/>
<rect x="701" y="381" width="198" height="158" fill="#112927" stroke="#9dbaa1" stroke-opacity=".55" stroke-width="2"/>
<rect x="753" y="406" width="94" height="133" fill="#050e12" stroke="#bac9ad" stroke-opacity=".25"/>
<rect x="770" y="426" width="59" height="17" fill="#5e9880" opacity=".28"/>
<path d="M 796 540 V900 M 780 540 L650 900 M 815 540 L950 900 M 730 540 L180 900 M 870 540 L1420 900" stroke="#7c9f90" stroke-width="2" opacity=".15"/>
<path d="M0 810 L650 537 M0 692 L650 523 M0 583 L650 504 M1600 810 L950 537 M1600 692 L950 523 M1600 583 L950 504" stroke="#a9c1a7" stroke-width="2" opacity=".14"/>
